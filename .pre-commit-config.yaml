repos:
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    - id: black
      language_version: python3.12
-   repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
    - id: flake8
-   repo: https://github.com/pycqa/isort
    rev: 9.0.0b1
    hooks:
      - id: isort
        name: isort (python)
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.108.1 # Get the latest from: https://github.com/antonbabenko/pre-commit-terraform/releases
  hooks:
    - id: terraform_fmt
    - id: terraform_docs
